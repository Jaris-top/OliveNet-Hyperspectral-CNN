seed: 42
classes: ["natural", "synthetic", "dyed"]

data:
  root: "data/demo"
  image_size: 64
  pca_components: 10
  pca_variance: 0.95
  split:
    train: 0.70
    val: 0.15
    test: 0.15
  augment: true

model:
  input_channels: 10
  num_classes: 3
  dropout: 0.5

training:
  epochs: 8
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.00001
  lr_decay_gamma: 0.9
  lr_decay_step: 5
  early_stopping_patience: 5
  output_dir: "outputs/demo"

