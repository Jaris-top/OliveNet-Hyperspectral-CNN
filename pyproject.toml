[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemstone-hsi-olivenet"
version = "0.1.0"
description = "Hyperspectral olivine authenticity identification with OliveNet"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Jiarui Yu" }]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

